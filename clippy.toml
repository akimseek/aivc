# clippy 配置。测试代码允许 unwrap/expect/panic，生产代码由 workspace.lints 禁止。
allow-unwrap-in-tests = true
allow-expect-in-tests = true
allow-panic-in-tests = true
allow-indexing-slicing-in-tests = true
allow-dbg-in-tests = true
# 分派表的长度与**命令数**成正比，而非复杂度：`CommandRouter::dispatch` 每接一条命令
# 就长两三行。把它拆成按域分组的多个方法只会让「命令 → 处理位置」的对应关系
# 变得难找。因此这个上限比一般函数宽，其余函数仍按 120 约束。
too-many-lines-threshold = 150
