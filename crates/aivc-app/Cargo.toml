[package]
name = "aivc-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "唯一二进制：装配、窗口、托盘、生命周期与退出清理"

# 产物名是 **AI**（Windows 下 AI.exe；macOS/Linux 同为 AI）。
# 包名保持 aivc-app（工作区引用、xtask 分层与脚本都按包名），只有落盘的二进制换名。
[[bin]]
name = "AI"
path = "src/main.rs"

[dependencies]
tauri = { workspace = true }
aivc-core = { workspace = true }
aivc-provider = { workspace = true }
aivc-gateway = { workspace = true }
aivc-ipc = { workspace = true }
aivc-infra = { workspace = true }
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tokio = { workspace = true }
tauri-plugin-notification = "2.4.0"
tauri-plugin-dialog = "2.7.3"
tauri-plugin-clipboard-manager = "2.3.3"

[build-dependencies]
tauri-build = { workspace = true }

[target.'cfg(windows)'.dependencies]
tauri-winrt-notification = "0.7.3"
winreg = "0.55.0"

[dev-dependencies]
wiremock = { workspace = true }
reqwest = { workspace = true }
tempfile = { workspace = true }

[lints]
workspace = true
