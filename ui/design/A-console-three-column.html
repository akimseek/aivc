<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>A · 控制台三列（区域化 · 全功能）</title>
<style>
  :root{
    --bg:#f4f6f9;--surface:#fff;--surface-2:#f7f9fc;--surface-3:#eef2f7;--border:#e3e8f0;
    --text:#182029;--dim:#5f6b7a;--faint:#93a0b0;
    --accent:#2563d9;--accent-soft:#e8f0fe;
    --ok:#15803d;--ok-soft:#e8f6ed;--warn:#92610c;--warn-soft:#fdf5e6;--danger:#b03030;--danger-soft:#fdecec;
    --r:9px;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{font:14px/1.65 "Segoe UI","Microsoft YaHei",system-ui,sans-serif;color:var(--text);
    background:var(--bg);display:grid;grid-template-rows:30px 54px 1fr 30px;height:100vh;overflow:hidden}

  /* 菜单栏 */
  .menubar{background:#101722;color:#cbd5e1;display:flex;align-items:center;gap:4px;padding:0 12px;font-size:12.5px}
  .menubar .logo{width:20px;height:20px;border-radius:5px;background:var(--accent);display:grid;place-items:center;font-size:10px;font-weight:700;margin-right:8px}
  .menubar span{padding:3px 9px;border-radius:5px;cursor:pointer}
  .menubar span:hover{background:#1d2735}
  .menubar .grow{flex:1}
  .menubar .k{color:#7d8b9e;font-size:11.5px}

  /* 上下文条 */
  .ctxbar{background:#fff;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px;padding:0 18px}
  .ctxbar .seg{display:flex;align-items:center;gap:7px;height:32px;padding:0 11px;border:1px solid var(--border);border-radius:var(--r);cursor:pointer;background:#fff}
  .ctxbar .seg:hover{background:var(--surface-2)}
  .ctxbar .k{font-size:10px;letter-spacing:.07em;text-transform:uppercase;color:var(--faint)}
  .ctxbar .v{font-weight:620;font-size:13px}
  .ctxbar .caret{color:var(--faint);font-size:9px}
  .pill{font-size:11.5px;font-weight:650;border-radius:20px;padding:2px 10px}
  .pill.ok{background:var(--ok-soft);color:var(--ok)}
  .pill.warn{background:var(--warn-soft);color:var(--warn)}
  .ctxbar .grow{flex:1}
  .btn{height:32px;padding:0 13px;border:1px solid var(--border);background:#fff;border-radius:var(--r);
    font-size:12.5px;color:var(--dim);cursor:pointer;font-weight:550}
  .btn:hover{background:var(--surface-2);color:var(--text)}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}

  /* 三列 */
  .body{display:grid;grid-template-columns:190px 312px 1fr;min-height:0;gap:1px;background:var(--border)}
  .col{background:var(--surface);min-height:0;display:grid;grid-template-rows:auto 1fr}
  .col > .hd{padding:13px 16px 10px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:9px}
  .col > .hd h2{margin:0;font-size:13.5px;font-weight:680}
  .col > .hd .n{font-size:11.5px;color:var(--faint)}
  .col > .bd{overflow:auto;min-height:0;padding:12px 14px}

  /* 主导航 */
  nav{background:var(--surface-2);padding:10px 9px;display:grid;gap:2px;align-content:start}
  nav button{display:flex;align-items:center;gap:10px;width:100%;padding:9px 11px;border:0;background:transparent;
    border-radius:var(--r);cursor:pointer;font:inherit;font-size:13px;color:var(--dim);text-align:left}
  nav button:hover{background:var(--surface-3)}
  nav button.on{background:var(--accent-soft);color:var(--accent);font-weight:660}
  nav .ic{width:17px;text-align:center;opacity:.85}
  nav .grow{flex:1}
  nav .badge{font-size:10.5px;font-weight:700;background:var(--surface-3);color:var(--dim);border-radius:20px;padding:1px 7px}
  nav button.on .badge{background:#fff;color:var(--accent)}
  nav .sep{margin:9px 4px 5px;font-size:10px;letter-spacing:.09em;text-transform:uppercase;color:var(--faint)}

  /* 列表行 */
  .row{padding:10px 11px;border-radius:var(--r);cursor:pointer;display:grid;gap:3px;border:1px solid transparent}
  .row:hover{background:var(--surface-2)}
  .row.on{background:var(--accent-soft);border-color:#d3e0fb}
  .row .t{font-weight:620;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .row.on .t{color:var(--accent)}
  .row .m{font-size:12px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .row .meta{font-size:11.5px;color:var(--faint);display:flex;gap:9px}
  .field{display:grid;gap:5px;margin-bottom:14px}
  .field label{font-size:12px;color:var(--dim);font-weight:600}
  .field .in{height:34px;border:1px solid var(--border);border-radius:var(--r);display:flex;align-items:center;padding:0 11px;font-size:13px;background:#fff;color:var(--text)}
  .field .in.mono{font-family:Consolas,monospace;font-size:12.5px}
  .field .hint{font-size:11.5px;color:var(--faint)}

  /* 工作区 */
  .work{background:var(--surface);display:grid;grid-template-rows:auto 1fr;min-height:0}
  .tabs{display:flex;align-items:center;gap:3px;padding:8px 14px 0;border-bottom:1px solid var(--border);overflow:hidden}
  .tab{padding:7px 13px;border-radius:8px 8px 0 0;font-size:12.5px;color:var(--dim);cursor:pointer;white-space:nowrap;display:flex;gap:7px;align-items:center}
  .tab:hover{background:var(--surface-2)}
  .tab.on{background:var(--surface);border:1px solid var(--border);border-bottom-color:#fff;margin-bottom:-1px;color:var(--text);font-weight:640}
  .tab .x{color:var(--faint);font-size:11px}
  .tab .at{color:#d97706}
  .pane{overflow:auto;min-height:0;padding:22px 30px}
  .doc{max-width:76ch}
  .doc h3{margin:0 0 4px;font-size:16px;font-weight:680}
  .eyebrow{font-size:12px;color:var(--faint);display:flex;gap:9px;margin-bottom:20px}
  .msg{margin-bottom:20px}
  .who{font-size:11.5px;font-weight:700;color:var(--faint);margin-bottom:5px}
  .msg.u .who{color:var(--accent)}
  .body-t{white-space:pre-wrap}
  code{font:12.5px/1.5 Consolas,monospace;background:var(--surface-3);border-radius:4px;padding:1px 5px}
  .cue{display:flex;align-items:center;justify-content:space-between;gap:12px;border:1px solid #f0d9ac;
    background:#fffcf5;color:var(--warn);border-radius:var(--r);padding:11px 13px;font-size:12.5px;margin-bottom:20px}
  .cue button{height:27px;padding:0 11px;border:1px solid #e8d3a8;background:#fff;color:var(--warn);border-radius:7px;font-size:12.5px;cursor:pointer;font-weight:600}

  .term{background:#0d1117;color:#c9d1d9;border-radius:var(--r);padding:14px 16px;font:12.5px/1.7 Consolas,monospace;white-space:pre-wrap}
  .term .p{color:#7ee787}.term .c{color:#79c0ff}.term .e{color:#ffa657}.term .d{color:#8b949e}
  .kpi{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:20px}
  .kpi div{border:1px solid var(--border);border-radius:var(--r);padding:11px 13px;background:var(--surface-2)}
  .kpi b{display:block;font-size:19px;font-weight:700;letter-spacing:-.02em}
  .kpi span{font-size:11.5px;color:var(--faint)}
  table{width:100%;border-collapse:collapse;font-size:12.5px}
  th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--border)}
  th{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--faint);font-weight:700}
  .tag{font-size:11px;border-radius:20px;padding:1px 8px;font-weight:640}
  .tag.ok{background:var(--ok-soft);color:var(--ok)}.tag.no{background:var(--danger-soft);color:var(--danger)}
  .tag.w{background:var(--warn-soft);color:var(--warn)}

  /* 状态栏 */
  .status{background:#101722;color:#9aa8ba;display:flex;align-items:center;gap:16px;padding:0 16px;font-size:11.5px}
  .status b{color:#dbe4f0;font-weight:600}
  .status .grow{flex:1}
  .status .dot{width:6px;height:6px;border-radius:50%;background:#22c55e;display:inline-block;margin-right:5px}

  [hidden]{display:none !important}
  .area{display:contents}
</style>
</head>
<body>
  <div class="menubar">
    <span class="logo">AI</span>
    <span>文件</span><span>编辑</span><span>视图</span><span>供应商</span><span>帮助</span>
    <span class="grow"></span>
    <span class="k">⌘K 命令面板</span>
  </div>

  <div class="ctxbar">
    <div class="seg"><span class="k">平台</span><span class="v">Codex</span><span class="caret">▾</span></div>
    <div class="seg"><span class="k">目标</span><span class="v">WSL · Ubuntu-24.04</span><span class="caret">▾</span></div>
    <span class="pill ok">找到 Codex 会话</span>
    <span class="pill warn">Ubuntu-22.04 无法进入</span>
    <span class="grow"></span>
    <button class="btn">诊断</button>
    <button class="btn">重新探测</button>
  </div>

  <div class="body">
    <nav>
      <div class="sep">会话</div>
      <button class="on" data-a="s"><span class="ic">💬</span><span class="grow">会话</span><span class="badge">6</span></button>
      <button data-a="t"><span class="ic">▮</span><span class="grow">终端</span><span class="badge">3</span></button>
      <button data-a="f"><span class="ic">★</span><span class="grow">快捷访问</span></button>
      <button data-a="g"><span class="ic">🔍</span><span class="grow">全局搜索</span></button>
      <div class="sep">配置</div>
      <button data-a="v"><span class="ic">◇</span><span class="grow">供应商</span><span class="badge">4</span></button>
      <button data-a="w"><span class="ic">⇄</span><span class="grow">网关</span></button>
      <button data-a="k"><span class="ic">✦</span><span class="grow">技能</span><span class="badge">7</span></button>
      <button data-a="c"><span class="ic">⚙</span><span class="grow">设置</span></button>
    </nav>

    <div class="col" id="listCol">
      <div class="hd"><h2 id="listTitle">会话</h2><span class="n" id="listNote">活跃 · 6 条</span></div>
      <div class="bd" id="listBody"></div>
    </div>

    <div class="work">
      <div class="tabs" id="tabs"></div>
      <div class="pane" id="pane"></div>
    </div>
  </div>

  <div class="status">
    <span><span class="dot"></span>已连接</span>
    <span>会话 <b>重构会话列表的读取路径</b></span>
    <span>cwd <b>/home/akim/code/ai</b></span>
    <span>供应商 <b>官方 · gpt-5-codex</b></span>
    <span class="grow"></span>
    <span>网关 <b>127.0.0.1:51059</b></span>
    <span>批量选择 <b>0</b></span>
  </div>

<script>
const L = {
  s:{title:"会话",note:"活跃 · 6 条",tabs:["重构会话列表的读取路径","排查 WSL 冷启动","目标探测的四态文案"],
    rows:[["重构会话列表的读取路径","14:32 · 42 条",1],["排查 WSL 冷启动","11:08 · 18 条"],
          ["目标探测的四态文案","昨天 · 7 条"],["常驻 worker 的 stdin 契约","昨天 · 31 条"],
          ["启动预热收窄","2 天前 · 12 条"],["运行期布局与旧工程切割","2 天前 · 9 条"]]},
  t:{title:"终端",note:"3 个活动终端",tabs:["终端 · codex","终端 · 系统 shell"],
    rows:[["codex — /home/akim/code/ai","运行中 · 12 分钟",1],["shell — /home/akim","运行中"],["codex — ~/scratch","已退出"]]},
  f:{title:"快捷访问",note:"收藏 2 · 最近 3",tabs:["快捷访问"],
    rows:[["★ 目标探测的四态文案","Codex · WSL·Ubuntu-24.04",1],["★ 运行期布局与旧工程切割","Codex · 本机"],
          ["重构会话列表的读取路径","最近打开"],["排查 WSL 冷启动","最近打开"],["启动预热收窄","最近打开"]]},
  g:{title:"全局搜索",note:"跨平台 · 跨目标",tabs:["全局搜索"],
    rows:[["“冷启动” · 12 条命中","Codex · 全部目标",1],["“批量读取” · 4 条命中","Codex · WSL·Ubuntu-24.04"],
          ["“worker” · 9 条命中","Codex · 本机"]]},
  v:{title:"供应商",note:"4 个 · 3 条路由规则",tabs:["供应商"],
    rows:[["官方 v2","codex · 已启用 · 3 个模型",1],["中转 A","codex · 已启用 · api.example.com"],
          ["备用 B","codex · 已禁用"],["Claude 官方","claude · 已启用"]]},
  w:{title:"网关",note:"运行中 · 端口 51059",tabs:["网关"],
    rows:[["健康状态","8/8 成功 · p95 412 ms",1],["失败转移规则","3 条"],["请求日志","最近 128 条"]]},
  k:{title:"技能",note:"7 个 · 3 个启用",tabs:["技能"],
    rows:[["code-review","已启用 · 本地",1],["git-commit","已启用"],["api-design","已禁用"],["doc-writer","已启用"]]},
  c:{title:"设置",note:"运行根 D:\\code\\ai\\aivc-rs",tabs:["设置"],
    rows:[["WSL Codex 目录","已指定 /home/akim/.codex",1],["工作区预设","2 个"],["CLI 环境","Node 24.9.0 正常"],["关于","v0.1.0"]]}
};

const P = {
  s:`<div class="doc"><h3>重构会话列表的读取路径</h3>
     <div class="eyebrow"><span>codex</span><span>·</span><span>2026-09-26 14:32</span><span>·</span><span>42 条</span></div>
     <div class="cue"><span>发行版 <b>Ubuntu-22.04</b> 无法进入：MountDisk/HCS/E_ACCESSDENIED</span>
       <span><button>手动指定目录</button> <button>重新探测</button></span></div>
     <div class="msg u"><div class="who">你</div><div class="body-t">列出 WSL 里的会话要 30 秒，查一下根因。</div></div>
     <div class="msg"><div class="who">Codex</div><div class="body-t">根因在 WSL 冷启动：Stopped 时首次 <code>5.27 s</code>，紧接着 <code>0.09 s</code>，空闲 20 秒后 <code>6.90 s</code>。旧实现每文件一次 head、6 路并发，6 个 wsl.exe 抢同一次冷启动。</div></div>
     <div class="msg u"><div class="who">你</div><div class="body-t">改成一次批量读。</div></div>
     <div class="msg"><div class="who">Codex</div><div class="body-t">30.5 s → 337 ms → 165 ms。</div></div></div>`,
  t:`<div class="term"><span class="d"># 内嵌终端 · 已接管 codex TUI · 12 分钟</span>
<span class="p">akim@ubuntu</span>:<span class="c">~/code/ai</span>$ codex
<span class="d">╭─ Codex ──────────────────────────────╮</span>
<span class="d">│</span> 模型 gpt-5-codex   ·  上下文 38%      <span class="d">│</span>
<span class="d">╰──────────────────────────────────────╯</span>
> 把批量读取的脚本也改成走 worker
<span class="e">⏺</span> 已新增 WorkerOp::ReadHeads…
<span class="p">akim@ubuntu</span>:<span class="c">~/code/ai</span>$ <span class="d">▌</span></div>
     <p style="color:var(--faint);font-size:12.5px">终端关注中心：<b style="color:var(--warn)">1 个终端正在等待确认</b> — 切回该标签可继续。</p>`,
  f:`<table><tr><th>标题</th><th>目标</th><th>最近打开</th></tr>
     <tr><td>目标探测的四态文案</td><td>WSL · Ubuntu-24.04</td><td>今天 09:12</td></tr>
     <tr><td>运行期布局与旧工程切割</td><td>本机</td><td>昨天</td></tr></table>`,
  g:`<table><tr><th>查询</th><th>范围</th><th>命中</th></tr>
     <tr><td>冷启动</td><td>Codex · 全部目标</td><td>12</td></tr>
     <tr><td>批量读取</td><td>WSL · Ubuntu-24.04</td><td>4</td></tr></table>`,
  v:`<div class="doc"><h3>官方 v2</h3>
     <div class="field"><label>API Base URL</label><div class="in mono">https://api.example.com/v1</div></div>
     <div class="field"><label>API Key</label><div class="in mono">sk-••••••••••••••••3f7a</div><div class="hint">写入 CLI 配置前会先备份到 data/vendor-backups/</div></div>
     <div class="field"><label>模型</label><div class="in">gpt-5-codex · gpt-5 · o4-mini</div></div>
     <div class="field"><label>路由</label><div class="in">按供应商 · 失败转移 3 条规则</div></div></div>`,
  w:`<div class="kpi"><div><b>8/8</b><span>成功 / 总请求</span></div><div><b>412 ms</b><span>p95 延迟</span></div><div><b>0</b><span>熔断中</span></div></div>
     <table><tr><th>时间</th><th>供应商</th><th>状态</th><th>耗时</th></tr>
     <tr><td>14:32:08</td><td>官方 v2</td><td><span class="tag ok">200</span></td><td>388 ms</td></tr>
     <tr><td>14:31:55</td><td>中转 A</td><td><span class="tag w">超时 → 转移</span></td><td>3000 ms</td></tr>
     <tr><td>14:31:40</td><td>官方 v2</td><td><span class="tag ok">200</span></td><td>421 ms</td></tr></table>`,
  k:`<table><tr><th>技能</th><th>来源</th><th>状态</th></tr>
     <tr><td>code-review</td><td>本地</td><td><span class="tag ok">已启用</span></td></tr>
     <tr><td>git-commit</td><td>本地</td><td><span class="tag ok">已启用</span></td></tr>
     <tr><td>api-design</td><td>导入</td><td><span class="tag no">已禁用</span></td></tr></table>`,
  c:`<div class="doc">
     <div class="field"><label>WSL Codex 目录</label><div class="in mono">/home/akim/.codex</div><div class="hint">发行版进不去时，可用它手动接进来</div></div>
     <div class="field"><label>CLI 环境</label><div class="in">Node 24.9.0 · npm 10.9.3 · codex 已安装</div></div>
     <div class="field"><label>运行根</label><div class="in mono">D:\\code\\ai\\aivc-rs</div><div class="hint">数据、日志、WebView 数据都在这一个目录之下</div></div></div>`
};

document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>show(b.dataset.a));
function show(a){
  document.querySelectorAll('nav button').forEach(x=>x.classList.toggle('on',x.dataset.a===a));
  const d=L[a];
  listTitle.textContent=d.title; listNote.textContent=d.note;
  listBody.innerHTML=d.rows.map(r=>`<div class="row${r[2]?' on':''}"><div class="t">${r[0]}</div><div class="m">${r[1]}</div></div>`).join('');
  tabs.innerHTML=d.tabs.map((t,i)=>`<div class="tab${i===0?' on':''}">${t}<span class="x">✕</span></div>`).join('');
  pane.innerHTML=P[a];
}
show('s');
</script>
</body>
</html>
